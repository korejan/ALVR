name: Prettier Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # prettier CLI arguments: https://prettier.io/docs/en/cli.html
      # pinned to 2.x: prettier 3 changed default formatting and would flag existing sources
      - run: npx --yes prettier@2.7.1 --config alvr/dashboard/.prettierrc --check "**/*[!.min].{js,css}"
